server {
    listen 80;
    server_name without.net.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name without.net.cn;

    ssl_certificate     /etc/nginx/ssl/without.net.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/without.net.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/without.net.cn/html;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /user/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /cart/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /address { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /review/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }

    location /images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 管理后台 — 静态资源
    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    client_max_body_size 10m;
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>购物车</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            margin: 0 16px 8px;
            border-radius: var(--radius);
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
        }
        .cart-item img {
            width: 56px; height: 56px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            flex-shrink: 0;
        }
        .cart-item .info { flex: 1; min-width: 0; }
        .cart-item .info .name { font-size: 14px; font-weight: 600; }
        .cart-item .info .price-sm { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 2px; }
        .cart-item .item-total { font-size: 15px; font-weight: 700; color: var(--text); min-width: 60px; text-align: right; }
        .cart-list-wrap { padding-top: 12px; padding-bottom: 80px; }
        .qty-ctrl button { width: 28px; height: 28px; font-size: 16px; }
        .qty-ctrl input { width: 32px; height: 28px; font-size: 13px; }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="app-container">
    <div class="app-header">
        <a href="./index.html" class="back">←</a>
        <h1>购物车</h1>
        <span class="header-action" id="clearCart" style="font-size:14px;">清空</span>
    </div>

    <div class="cart-list-wrap" id="cartBox"></div>
    <div class="safe-bottom"></div>

    <div class="fixed-bottom">
        <div style="flex:1;">
            <span style="font-size:12px;color:var(--text-secondary);">合计 </span>
            <span style="font-size:20px;font-weight:800;color:var(--primary);" id="totalPrice">¥0.00</span>
        </div>
        <button class="btn" id="checkoutBtn" style="width:130px;height:42px;font-size:14px;">去结算</button>
    </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的购物车</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        header {
            height: 60px;
            background: #fff;
            box-shadow: 0 1px 4px #eee;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }
        .cart-wrap {
            width: 1200px;
            margin: 30px auto;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item img {
            width: 70px;
            height: 70px;
            margin-right: 16px;
        }
        .num-box {
            display: flex;
            align-items: center;
        }
        .num-box button {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: #fff;
        }
        .num-box input {
            width: 40px;
            height: 28px;
            text-align: center;
            border: 1px solid #ddd;
            border-left: none;
            border-right: none;
        }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #fff;
            box-shadow: 0 -1px 6px #eee;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 40px;
        }
        .total-price {
            font-size: 18px;
            color: #f40;
            margin-right: 20px;
        }
        .submit-order {
            width: 120px;
            height: 40px;
            background: #ff4400;
            color: #fff;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<header>
    <a href="./index.html">← 返回首页</a>
    <h3>我的购物车</h3>
</header>
<div class="cart-wrap" id="cartBox"></div>
<div class="bottom-bar">
    <div>合计：<span class="total-price" id="totalPrice">¥0.00</span></div>
    <button class="submit-order" id="goOrderBtn">去结算</button>
</div>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
</body>

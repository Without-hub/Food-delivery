<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>店铺详情</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        header {
            height: 60px;
            background: #fff;
            box-shadow: 0 1px 4px #eee;
            display: flex;
            align-items: center;
            padding: 0 40px;
        }
        header a {
            margin-right: 30px;
        }
        .food-wrap {
            width: 1200px;
            margin: 30px auto;
        }
        .food-item {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            align-items: center;
        }
        .food-item img {
            width: 80px;
            height: 80px;
            margin-right: 16px;
        }
        .food-info {
            flex: 1;
        }
        .add-cart-btn {
            width: 80px;
            height: 32px;
            background: #ff4400;
            color: #fff;
            border: none;
            border-radius: 4px;
        }
        .cart-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 120px;
            height: 44px;
            background: #ff4400;
            color: #fff;
            text-align: center;
            line-height: 44px;
            border-radius: 22px;
        }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<header>
    <a href="./index.html">← 返回首页</a>
    <h3 id="shopTitle">加载中...</h3>
</header>
<div class="food-wrap" id="foodBox"></div>
<a href="./cart.html" class="cart-float">去购物车</a>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/shop.js"></script>
</body>

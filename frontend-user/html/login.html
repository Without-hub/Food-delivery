<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .login-box {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .item {
            margin-bottom: 20px;
        }
        .item input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .tip-link {
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="card login-box">
    <h2>外卖点餐-用户登录</h2>
    <div class="item">
        <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="item">
        <input type="password" id="pwd" placeholder="请输入密码">
    </div>
    <button class="btn" id="loginBtn">登录</button>
    <div class="tip-link">
        <a href="./register.html">没有账号？去注册</a>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>

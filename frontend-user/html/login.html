<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>登录 - 外卖点餐</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        body { background: linear-gradient(180deg, #FF6B35 0%, #FF8C5A 30%, #FFF0EB 60%, #F5F6FA 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-wrap { width: 100%; max-width: 380px; padding: 20px; }
        .login-card { background: #fff; border-radius: var(--radius-xl); padding: 36px 28px 28px; box-shadow: var(--shadow-lg); }
        .logo-area { text-align: center; margin-bottom: 32px; }
        .logo-area .logo { width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), #FF8C5A); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 32px; box-shadow: 0 8px 24px rgba(255,107,53,0.3); }
        .logo-area h2 { font-size: 24px; font-weight: 800; }
        .logo-area p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-muted); z-index: 1; }
        .input-group input { width: 100%; height: 48px; padding: 0 14px 0 44px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 15px; background: var(--bg); transition: all var(--transition); }
        .input-group input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(255,107,53,0.08); }
        .login-btn { width: 100%; height: 48px; background: linear-gradient(135deg, var(--primary), #FF8C5A); color: #fff; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 1px; box-shadow: 0 4px 16px rgba(255,107,53,0.35); transition: all var(--transition); margin-top: 8px; }
        .login-btn:active { transform: scale(0.98); }
        .login-footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary); }
        .login-footer a { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="login-wrap animate-in">
    <div class="login-card">
        <div class="logo-area">
            <div class="logo">🍜</div>
            <h2>欢迎回来</h2>
            <p>登录你的外卖账号</p>
        </div>
        <div class="input-group">
            <span class="icon">👤</span>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" id="pwd" placeholder="请输入密码">
        </div>
        <button class="login-btn" id="loginBtn">登 录</button>
        <div class="login-footer">
            还没有账号？<a href="./register.html">立即注册</a>
        </div>
    </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>

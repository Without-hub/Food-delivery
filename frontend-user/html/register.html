<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .reg-box {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
        }
        .reg-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .item {
            margin-bottom: 18px;
        }
        .item input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .tip-link {
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="card reg-box">
    <h2>外卖点餐-用户注册</h2>
    <div class="item">
        <input type="text" id="name" placeholder="请输入用户名">
    </div>
    <div class="item">
        <input type="text" id="phone" placeholder="请输入手机号">
    </div>
    <div class="item">
        <input type="password" id="pwd" placeholder="请设置密码（不少于6位）">
    </div>
    <button class="btn" id="regBtn">立即注册</button>
    <div class="tip-link">
        <a href="./login.html">已有账号？去登录</a>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/register.js"></script>
</body>

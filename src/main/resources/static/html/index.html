<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>外卖点餐</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .banner-wrap { margin: 12px 16px 0; }
        .food-grid { padding-bottom: 20px; }
        .shop-item { cursor: pointer; }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="app-container">
    <!-- 顶部导航 -->
    <div class="app-header">
        <h1>🍜 外卖点餐</h1>
        <span class="header-action" onclick="location.href='./order-list.html'">📋</span>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索商家或美食...">
    </div>

    <!-- Banner 轮播 -->
    <div class="banner-wrap" id="bannerWrap">
        <img class="banner-slide" id="bannerImg" src="https://picsum.photos/seed/banner1/800/280" alt="">
        <div class="banner-dots" id="bannerDots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <!-- 分类导航 -->
    <div class="category-grid" id="categoryGrid"></div>

    <!-- 推荐商品 -->
    <div class="section-title" style="padding:16px 16px 8px;">🔥 附近好店</div>
    <div class="food-grid" id="shopBox"></div>
    <div class="safe-bottom"></div>
</div>

<!-- 浮动购物车 -->
<a href="./cart.html" class="float-cart" id="floatCart">
    🛒
    <span class="count" id="cartBadge">0</span>
</a>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/index.js"></script>
<script>
// 搜索
document.getElementById("searchInput").addEventListener("keyup", function(e) {
    const keyword = this.value.trim().toLowerCase();
    document.querySelectorAll(".food-card").forEach(el => {
        const name = (el.querySelector(".food-name")?.textContent || "").toLowerCase();
        el.style.display = (!keyword || name.includes(keyword)) ? "" : "none";
    });
});
</script>
</body>
</html>

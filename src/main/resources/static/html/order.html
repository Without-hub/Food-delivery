<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>确认订单</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        header { height: 60px; background: #fff; box-shadow: 0 1px 4px #eee; display: flex; align-items: center; padding: 0 40px; }
        .wrap { width: 1200px; margin: 30px auto; }
        .section-title { font-size: 16px; font-weight: bold; margin: 16px 0 10px; }
        .addr-card { padding: 16px; border: 1px solid #eee; margin-bottom: 20px; border-radius: 8px; }
        .addr-card label { display: block; padding: 8px 12px; border: 1px solid #eee; margin: 6px 0; cursor: pointer; border-radius: 6px; }
        .addr-card label:hover { border-color: #ff4400; }
        .addr-card label.selected { border-color: #ff4400; background: #fff5f0; }
        .addr-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding: 12px; background: #fafafa; border-radius: 6px; }
        .addr-form input { height: 34px; padding: 0 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .addr-form input.name { width: 100px; }
        .addr-form input.phone { width: 140px; }
        .addr-form input.detail { width: 350px; }
        .addr-form button { height: 34px; padding: 0 20px; background: #ff4400; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .goods-list { margin: 20px 0; }
        .goods-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .submit-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; box-shadow: 0 -1px 6px #eee; display: flex; align-items: center; justify-content: flex-end; padding-right: 40px; }
        .total-text { font-size: 20px; color: #f40; margin-right: 20px; font-weight: bold; }
        .submit-order-btn { width: 130px; height: 42px; background: #ff4400; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<header>
    <a href="./cart.html">← 返回购物车</a>
    <h3>确认订单</h3>
</header>
<div class="wrap">
    <div class="section-title">📍 收货地址</div>
    <div class="addr-card" id="addrBox">加载收货地址...</div>
    <button id="showAddrForm" style="margin-bottom:16px;background:none;border:1px dashed #ddd;padding:6px 16px;border-radius:4px;cursor:pointer;color:#999;">+ 新增地址</button>
    <div class="addr-form" id="addrForm" style="display:none">
        <input class="name" id="newName" placeholder="联系人">
        <input class="phone" id="newPhone" placeholder="手机号">
        <input class="detail" id="newDetail" placeholder="详细地址">
        <button id="saveAddr">保存</button>
        <button onclick="document.getElementById('addrForm').style.display='none'" style="background:#eee;color:#333;">取消</button>
    </div>
    <div class="section-title">🛒 商品清单</div>
    <div class="goods-list" id="goodsBox"></div>
</div>
<div class="submit-bar">
    <div>实付：<span class="total-text" id="payTotal">¥0.00</span></div>
    <button class="submit-order-btn" id="submitBtn">提交订单</button>
</div>

<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/order.js"></script>
</body></html>

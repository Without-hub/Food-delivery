<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>店铺详情</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .shop-cover {
            background: #fff;
            margin: 0 16px 12px;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .shop-cover .avatar {
            width: 72px; height: 72px;
            border-radius: var(--radius);
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg);
        }
        .shop-cover .info { flex: 1; }
        .shop-cover .info h2 { font-size: 20px; font-weight: 700; }
        .shop-cover .info .meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
        .shop-cover .info .desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .food-grid { padding-bottom: 80px; }
        .food-card .food-img { height: 120px; }
        .food-card .add-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg,var(--primary),#FF8C5A);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255,107,53,0.3);
            flex-shrink: 0;
        }
        .food-card .add-btn:active { transform: scale(0.9); }
        .food-card .food-bottom .price { font-size: 15px; }
        .cat-tab { display: inline-block; }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="app-container">
    <div class="app-header">
        <a href="./index.html" class="back">←</a>
        <h1 id="shopTitle">加载中...</h1>
        <span class="header-action" onclick="location.href='./cart.html'">🛒</span>
    </div>

    <div class="page-enter" style="padding-top:12px;">
        <!-- 店铺信息 -->
        <div class="shop-cover">
            <img class="avatar" id="shopImg" src="" alt="">
            <div class="info">
                <h2 id="shopName">---</h2>
                <div class="meta" id="shopMeta"></div>
                <div class="desc" id="shopDesc"></div>
            </div>
        </div>

        <!-- 分类 Tabs -->
        <div class="tab-bar" id="catTabs"></div>

        <!-- 菜品列表 -->
        <div class="food-grid" id="foodBox"></div>
        <div class="safe-bottom"></div>
    </div>

    <!-- 底部总计 -->
    <div class="fixed-bottom" id="bottomBar">
        <div style="flex:1;">
            <span style="font-size:12px;color:var(--text-secondary);">已选 </span>
            <span style="font-size:16px;font-weight:800;color:var(--primary);" id="cartTotalInShop">¥0</span>
        </div>
        <a href="./cart.html" class="btn" style="width:130px;height:40px;font-size:14px;">去购物车</a>
    </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/shop.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>配送跟踪</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .progress-section {
            background: #fff;
            margin: 0 16px 12px;
            border-radius: var(--radius);
            padding: 24px 20px;
            box-shadow: var(--shadow-sm);
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 16px 0 8px;
        }
        .progress-steps::before {
            content: "";
            position: absolute;
            top: 14px;
            left: 30px;
            right: 30px;
            height: 3px;
            background: var(--border);
            z-index: 0;
        }
        .progress-steps .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
            flex: 1;
        }
        .progress-steps .step .dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: var(--border);
            color: var(--text-muted);
            transition: all 0.5s;
        }
        .progress-steps .step.active .dot {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 10px rgba(255,107,53,0.3);
        }
        .progress-steps .step.done .dot {
            background: var(--success);
            color: #fff;
        }
        .progress-steps .step .label {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
        }
        .progress-steps .step.active .label { color: var(--primary); font-weight: 600; }
        .progress-steps .step.done .label { color: var(--success); font-weight: 600; }
        .delivery-card {
            background: #fff;
            margin: 0 16px 12px;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .delivery-card .avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .delivery-card .info { flex: 1; }
        .delivery-card .info .name { font-weight: 600; font-size: 16px; }
        .delivery-card .info .status-text { font-size: 13px; color: var(--primary); margin-top: 2px; }
        .delivery-card .call-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary);
            cursor: pointer;
        }
        .delivery-card .call-btn:active { background: var(--primary); color: #fff; }
        .map-placeholder {
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            margin: 0 16px 12px;
            border-radius: var(--radius);
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #66BB6A;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }
        .map-placeholder::after {
            content: "";
            position: absolute;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            top: 30px; left: 60px;
        }
        .order-info-card {
            background: #fff;
            margin: 0 16px 12px;
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
        }
        .order-info-card .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
        }
        .order-info-card .row .label { color: var(--text-secondary); }
    </style>
</head>
<body>
<div class="msg-tip"></div>
<div class="app-container">
    <div class="app-header">
        <a href="javascript:history.back()" class="back">←</a>
        <h1>配送跟踪</h1>
    </div>
    <div class="page-enter" style="padding-top:12px;padding-bottom:20px;">
        <!-- 进度条 -->
        <div class="progress-section">
            <div style="font-weight:700;font-size:16px;text-align:center;" id="statusTitle">商家正在备餐中</div>
            <div class="progress-steps" id="progressSteps">
                <div class="step done"><div class="dot">✓</div><div class="label">已接单</div></div>
                <div class="step active"><div class="dot">👨‍🍳</div><div class="label">备餐中</div></div>
                <div class="step"><div class="dot">🚚</div><div class="label">配送中</div></div>
                <div class="step"><div class="dot">🏠</div><div class="label">已送达</div></div>
            </div>
            <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px;" id="etaText">预计 30 分钟送达</div>
        </div>

        <!-- 地图模拟 -->
        <div class="map-placeholder">
            🗺️
            <span style="position:relative;z-index:1;background:rgba(255,255,255,0.85);padding:8px 16px;border-radius:12px;font-size:14px;color:var(--text);">
                📍 配送员距您约 1.2km
            </span>
        </div>

        <!-- 配送员 -->
        <div class="delivery-card">
            <div class="avatar">👨‍🦱</div>
            <div class="info">
                <div class="name">王师傅</div>
                <div class="status-text">🟢 正在向您配送中</div>
            </div>
            <div class="call-btn" onclick="Common.showMsg('拨打配送员电话 138****8888')">📞</div>
        </div>

        <!-- 订单信息 -->
        <div class="order-info-card">
            <div style="font-weight:600;margin-bottom:8px;">📋 订单信息</div>
            <div class="row"><span class="label">订单编号</span><span id="infoOrderNo">---</span></div>
            <div class="row"><span class="label">下单时间</span><span id="infoTime">---</span></div>
            <div class="row"><span class="label">收货地址</span><span id="infoAddr">---</span></div>
        </div>
    </div>
</div>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/tracking.js"></script>
</body>
</html>

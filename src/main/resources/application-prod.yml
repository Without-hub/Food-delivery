server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_delivery?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: food_user
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.fooddelivery.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.fooddelivery: warn

# JWT 配置（生产环境）
jwt:
  secret: food***********************************************************************n
  expiration: 86400000  # 24小时

server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_delivery?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: [redacted]

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.fooddelivery.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.fooddelivery: debug

# JWT 配置（开发环境）
jwt:
  secret: food**************************
  expiration: 86400000  # 24小时
